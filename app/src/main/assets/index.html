<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Med Tracker</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f6f4;padding:16px}h1{font-size:26px;margin:4px 0 2px}.sub{color:#5a6b61;font-size:14px;margin-bottom:14px}.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;border:2px solid transparent}.card.taken{border-color:#1fa672;background:#eefaf3}.name{font-size:20px;font-weight:700}.time{font-size:13px;background:#eef2ef;padding:5px 10px;border-radius:99px}button{width:100%;padding:16px;border:0;border-radius:14px;font-size:17px;font-weight:700}.btn-take{background:#111;color:#fff}.btn-undo{background:#e6ece8;color:#111;margin-top:8px}.hist{background:#fff;border-radius:16px;padding:14px}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:14px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.ok{background:#1fa672}.miss{background:#d9dee0}.note{font-size:13px;color:#5a6b61;line-height:1.5}.edit{background:#eef2ef;color:#111;padding:8px;margin-top:8px;font-size:14px}.alarm{font-size:13px;color:#1a7a52;font-weight:600;margin-top:6px}</style></head><body><h1>Med Tracker</h1><div class="sub" id="date"></div><div id="cards"></div><div class="hist"><b>Last 7 days</b><div id="hist"></div><button style="margin-top:12px;background:#fff;border:1px solid #ccc" onclick="clearToday()">Clear today</button></div><p class="note">Alarm is always set in background. When you change a time, the alarm changes too. If you miss a dose, check your prescription info or ask your pharmacist or clinician.</p><script>const MEDS=[{id:'amitriptyline',name:'Amitriptyline',time:'11:00 AM'},{id:'gabapentin',name:'Gabapentin',time:'7:00 PM'}];function tk(){let n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}function load(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}function save(k,v){localStorage.setItem(k,v)}function parseTime(t){let m=t.match(/(\d+):(\d+)\s*(AM|PM)/i);if(!m)return{hour:11,minute:0};let h=parseInt(m[1]),mi=parseInt(m[2]);if(m[3].toUpperCase()==='PM'&&h!==12)h+=12;if(m[3].toUpperCase()==='AM'&&h===12)h=0;return{hour:h,minute:mi}}function syncAlarm(med,timeStr){try{if(window.Android){let p=parseTime(timeStr);window.Android.setAlarm(med.name,p.hour,p.minute);}}catch(e){}}function render(){let t=tk(),d=load('med-'+t);document.getElementById('date').textContent=new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'});document.getElementById('cards').innerHTML=MEDS.map(m=>{let v=d[m.id];let tm=localStorage.getItem('time-'+m.id)||m.time;return `<div class="card ${v?'taken':''}"><div style="display:flex;justify-content:space-between"><div class="name">${m.name}</div><div class="time">${tm}</div></div><p>${v?'Taken at '+v:'Not taken yet'}</p><div class="alarm">Alarm set for ${tm} - always on in background</div>${v?`<button class="btn-undo" onclick="undo('${m.id}')">Undo</button>`:`<button class="btn-take" onclick="take('${m.id}')">Mark as taken</button>`}<button class="edit" onclick="editTime('${m.id}')">Edit time</button><div id="edit-${m.id}" style="display:none;margin-top:8px"><input type="time" id="input-${m.id}" style="width:100%;padding:12px;font-size:16px"><button class="btn-take" style="margin-top:8px" onclick="saveTime('${m.id}')">Save time</button></div></div>`}).join('');let h='';for(let i=0;i<7;i++){let dd=new Date();dd.setDate(dd.getDate()-i);let k=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');let dv=load('med-'+k);h+=`<div class="row"><span>${i===0?'Today':dd.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})}</span><span>Amitriptyline <i class="dot ${dv.amitriptyline?'ok':'miss'}"></i> Gabapentin <i class="dot ${dv.gabapentin?'ok':'miss'}"></i></span></div>`}document.getElementById('hist').innerHTML=h;MEDS.forEach(m=>{let tm=localStorage.getItem('time-'+m.id)||m.time;syncAlarm(m,tm)});}function take(id){let k='med-'+tk(),d=load(k);d[id]=new Date().toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});save(k,JSON.stringify(d));render()}function undo(id){let k='med-'+tk(),d=load(k);delete d[id];save(k,JSON.stringify(d));render()}function clearToday(){localStorage.removeItem('med-'+tk());render()}function editTime(id){document.getElementById('edit-'+id).style.display='block'}function saveTime(id){let val=document.getElementById('input-'+id).value;if(!val)return;let parts=val.split(':');let h=parseInt(parts[0]),mi=parts[1];let ap=h>=12?'PM':'AM';let h12=h%12||12;let str=h12+':'+mi+' '+ap;localStorage.setItem('time-'+id,str);let med=MEDS.find(x=>x.id===id);syncAlarm(med,str);render()}render();</script></body></html>
